[project]
name = "bundeswehr-dienstplan"
version = "0.1.0"
description = "Bundeswehr Dienstplan SaaS - Vollautomatisierte Dienstplanung"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic[dotenv]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "redis",
    "python-multipart",
    "python-dotenv",
    "alembic",
    "pytz",
    "ivory",
    "openpyxl",
    "python-icalendar",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "db_migrations"]
